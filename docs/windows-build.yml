name: Windows build and offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build standard solution
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Isolated regression tests
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Installer and startup script tests
        shell: pwsh
        run: ./scripts/Test-PortableScripts.ps1
      - name: Verify frozen source and portable packages
        shell: pwsh
        run: ./scripts/Package.ps1
